<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ScreenWise</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>ScreenWise</h1>
        <p>Smartphone Addiction Prediction System</p>

        <div class="card">

            <h2>Enter Your Details</h2>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" placeholder="Enter your age">
            </div>

            <div class="form-group">
                <label for="daily_screen_time_hours">Daily Screen Time (hours)</label>
                <input type="number" id="daily_screen_time_hours" step="0.1" placeholder="e.g. 7.5">
            </div>

            <div class="form-group">
                <label for="social_media_hours">Social Media Hours</label>
                <input type="number" id="social_media_hours" step="0.1" placeholder="e.g. 3.0">
            </div>

            <div class="form-group">
                <label for="gaming_hours">Gaming Hours</label>
                <input type="number" id="gaming_hours" step="0.1" placeholder="e.g. 2.0">
            </div>

            <div class="form-group">
                <label for="work_study_hours">Work/Study Hours</label>
                <input type="number" id="work_study_hours" step="0.1" placeholder="e.g. 5.0">
            </div>

            <div class="form-group">
                <label for="sleep_hours">Sleep Hours</label>
                <input type="number" id="sleep_hours" step="0.1" placeholder="e.g. 7.0">
            </div>

            <div class="form-group">
                <label for="notifications_per_day">Notifications Per Day</label>
                <input type="number" id="notifications_per_day" placeholder="e.g. 80">
            </div>

            <div class="form-group">
                <label for="app_opens_per_day">App Opens Per Day</label>
                <input type="number" id="app_opens_per_day" placeholder="e.g. 60">
            </div>

            <div class="form-group">
                <label for="weekend_screen_time">Weekend Screen Time (hours)</label>
                <input type="number" id="weekend_screen_time" step="0.1" placeholder="e.g. 8.0">
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label for="stress_level">Stress Level</label>
                <select id="stress_level">
                    <option value="">Select Stress Level</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>

            <div class="form-group">
                <label for="academic_work_impact">Academic Work Impact</label>
                <select id="academic_work_impact">
                    <option value="">Select Impact</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <button id="predictBtn">Predict</button>
            
            <div id="result"></div>

        </div>

    </div>

    <script src="/static/script.js"></script>

</body>
</html>
